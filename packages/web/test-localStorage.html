<!DOCTYPE html>
<html>
<head>
    <title>Test localStorage</title>
</head>
<body>
    <h1>Test localStorage Functions</h1>
    <button onclick="createTestData()">Create Test Data</button>
    <button onclick="clearData()">Clear Data</button>
    <button onclick="showData()">Show Data</button>
    <pre id="output"></pre>
    
    <script>
        const STORAGE_KEY = 'keybox_config';
        
        function createTestData() {
            const testConfig = {
                platforms: [{
                    id: crypto.randomUUID(),
                    name: 'Test Platform',
                    description: 'Test Description',
                    tags: ['test'],
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    key_groups: [{
                        id: crypto.randomUUID(),
                        name: 'TEST_API_KEY',
                        description: 'Test Key Group',
                        tags: ['client'],
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString(),
                        keys: [{
                            id: crypto.randomUUID(),
                            value: 'sk_test_12345',
                            note: 'Test key',
                            revoked: false,
                            created_at: new Date().toISOString(),
                            updated_at: new Date().toISOString()
                        }]
                    }]
                }],
                version: '1.0.0',
                lastUpdated: new Date().toISOString()
            };
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(testConfig));
            document.getElementById('output').textContent = 'Test data created!';
            showData();
        }
        
        function clearData() {
            localStorage.removeItem(STORAGE_KEY);
            document.getElementById('output').textContent = 'Data cleared!';
        }
        
        function showData() {
            const data = localStorage.getItem(STORAGE_KEY);
            document.getElementById('output').textContent = data ? JSON.stringify(JSON.parse(data), null, 2) : 'No data found';
        }
        
        // Show data on load
        showData();
    </script>
</body>
</html>
